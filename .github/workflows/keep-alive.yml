name: Keep GitHub Actions alive

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cronjob-based-github-action:
    name: Cronjob based github action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: entepotenz/keep-github-actions-alive-min-dependencies@v1
